# coturn hardened TURN/TURNS server configuration
# Specification compliance: RFC 5766, RFC 6156, RFC 5389

realm=nvrsms.local
listening-port=3478
tls-listening-port=5349
min-port=49152
max-port=65535

# Authentication: time-limited ephemeral HMAC credentials
use-auth-secret
static-auth-secret=${TURN_SECRET}

# Anti-Relay abuse / Anti-SSRF: Strictly block internal loopback, private subnets, and link-local targets
no-multicast-peers
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.0.2.0-192.0.2.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=198.51.100.0-198.51.100.255
denied-peer-ip=203.0.113.0-203.0.113.255
denied-peer-ip=240.0.0.0-255.255.255.255
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff

# TLS 1.2+ AEAD cipher enforcement
cipher-list="ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305"

# Security & DoS mitigations
stale-nonce=600
max-allocate-per-user=10
no-cli
no-tcp-relay
log-file=stdout
simple-log
