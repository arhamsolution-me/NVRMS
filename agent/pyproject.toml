[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nvrsms-agent"
version = "0.1.0"
description = "NVRSMS Edge Agent — connects to hub and manages NVR streams"
requires-python = ">=3.11"
dependencies = [
    # Async runtime
    "anyio>=4.6.0",

    # WebSocket client (control channel)
    "websockets>=13.0",

    # Configuration
    "pydantic-settings>=2.5.0",
    "pydantic>=2.9.0",

    # HTTP client (ONVIF probing, hub API)
    "httpx>=0.27.0",

    # Logging
    "structlog>=24.4.0",

    # Cryptography (credential encryption)
    "cryptography>=43.0.0",

    # ONVIF (NVR discovery, Stage 3+)
    # "onvif-zeep-async>=3.1.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.7.0",
    "black>=24.10.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["agent*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B"]
ignore = ["E501"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-v --tb=short"
filterwarnings = ["ignore::DeprecationWarning"]
