name: CI — NVRSMS Platform

on:
  push:
    branches: [main, develop, "stage-*"]
  pull_request:
    branches: [main, develop]

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"
  POSTGRES_PASSWORD: ci_test_password_123
  REDIS_PASSWORD: ci_redis_pass_123
  SECRET_KEY: ci-test-secret-key-at-least-32-chars-long
  SUPER_ADMIN_PASSWORD: CIAdmin123!

jobs:
  # ── Lint ────────────────────────────────────────────────────
  lint-hub:
    name: Lint — Hub Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install hub dev dependencies
        working-directory: hub-backend
        run: pip install -e ".[dev]"

      - name: Run ruff (lint)
        working-directory: hub-backend
        run: ruff check hub_backend/ tests/

      - name: Run ruff (format check)
        working-directory: hub-backend
        run: ruff format --check hub_backend/ tests/

  lint-agent:
    name: Lint — Agent
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install agent dev dependencies
        working-directory: agent
        run: pip install -e ".[dev]"

      - name: Run ruff (lint)
        working-directory: agent
        run: ruff check agent/ tests/

      - name: Run ruff (format check)
        working-directory: agent
        run: ruff format --check agent/ tests/

  # ── Hub Backend Tests ───────────────────────────────────────
  test-hub:
    name: Test — Hub Backend
    runs-on: ubuntu-latest
    needs: [lint-hub]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: nvrsms_test
          POSTGRES_USER: nvrsms
          POSTGRES_PASSWORD: ${{ env.POSTGRES_PASSWORD }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        working-directory: hub-backend
        run: pip install -e ".[dev]"

      - name: Run migrations
        working-directory: hub-backend
        env:
          DATABASE_URL: postgresql+asyncpg://nvrsms:${{ env.POSTGRES_PASSWORD }}@localhost:5432/nvrsms_test
        run: alembic upgrade head

      - name: Run tests
        working-directory: hub-backend
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://nvrsms:${{ env.POSTGRES_PASSWORD }}@localhost:5432/nvrsms_test
          TEST_REDIS_URL: redis://localhost:6379/1
          DATABASE_URL: postgresql+asyncpg://nvrsms:${{ env.POSTGRES_PASSWORD }}@localhost:5432/nvrsms_test
          REDIS_URL: redis://localhost:6379/1
          SECRET_KEY: ${{ env.SECRET_KEY }}
          POSTGRES_PASSWORD: ${{ env.POSTGRES_PASSWORD }}
          REDIS_PASSWORD: ${{ env.REDIS_PASSWORD }}
          SUPER_ADMIN_PASSWORD: ${{ env.SUPER_ADMIN_PASSWORD }}
          APP_ENV: development
        run: |
          pytest tests/ -v --tb=short \
            --cov=hub_backend --cov-report=term-missing \
            --cov-fail-under=80

  # ── Agent Tests ─────────────────────────────────────────────
  test-agent:
    name: Test — Agent
    runs-on: ubuntu-latest
    needs: [lint-agent]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        working-directory: agent
        run: pip install -e ".[dev]"

      - name: Run tests
        working-directory: agent
        run: pytest tests/ -v --tb=short --cov=agent --cov-report=term-missing

  # ── Gate Check ──────────────────────────────────────────────
  gate-check:
    name: Stage Gate Check
    runs-on: ubuntu-latest
    needs: [test-hub, test-agent]
    steps:
      - name: All tests passed
        run: echo "✅ Stage gate check passed — all tests green"
